name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run optional CPU benchmark
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint tools
        run: pip install -c constraints-edge.txt ruff black
      - name: Ruff
        run: ruff check edge training tests scripts benchmarks
      - name: Black
        run: black --check --diff edge training tests scripts

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install edge and development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run contract and unit tests
        run: pytest tests/ -v --tb=short -m "not training" --junitxml=test-results.xml
      - name: Upload test results
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pip-audit
        run: pip install -c constraints-edge.txt pip-audit
      - name: pip-audit locked edge requirements
        env:
          PIP_CONSTRAINT: constraints-edge.txt
        run: pip-audit -r requirements-edge.txt --strict --progress-spinner off
      - name: OSV scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --lockfile=constraints-edge.txt
            --recursive
            ./
        continue-on-error: true
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --no-git --redact

  build:
    name: Container build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build edge image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestration/docker/Dockerfile.edge
          push: false
          load: true
          tags: sentinel-edge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Confirm image user and missing model readiness
        run: |
          docker run --rm --user 1000:1000 -d --name sentinel-ci -p 18080:8080 sentinel-edge:${{ github.sha }}
          python - <<'PY'
          import time, urllib.request, urllib.error
          time.sleep(4)
          live = urllib.request.urlopen("http://127.0.0.1:18080/live").status
          assert live == 200
          try:
              urllib.request.urlopen("http://127.0.0.1:18080/ready")
              raise SystemExit("/ready must be 503 without a mounted model")
          except urllib.error.HTTPError as exc:
              assert exc.code == 503
          PY
          docker rm -f sentinel-ci
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: sentinel-edge:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true

  benchmark:
    name: Optional CPU benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install edge dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate labeled demo ONNX graph
        run: python scripts/generate_demo_onnx.py --output models/demo.onnx --manifest models/model_manifest.json
      - name: Run edge benchmark
        run: python benchmarks/edge_benchmark.py --model models/demo.onnx --threads 1 --output results/ci_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: results/ci_benchmark.json
