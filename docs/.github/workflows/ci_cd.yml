# ──────────────────────────────────────────────────────────────────────────────
# EdgeAI Sentinel — MLOps CI/CD Pipeline
#
# Runs on every push to main and on pull requests.
# Stages:
#   1. lint       — code quality checks
#   2. test       — unit and integration tests
#   3. benchmark  — CPU inference benchmark (no GPU needed)
#   4. build      — build and push edge container image
#   5. deploy     — (protected main branch only) deploy to edge fleet via Ansible
#
# Demonstrates: GitLab CI / GitHub Actions familiarity for MLOps
# ──────────────────────────────────────────────────────────────────────────────

name: EdgeAI Sentinel CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sentinel-edge

jobs:

  # ── Stage 1: Lint and Format ───────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff black

      - name: Run ruff (linter)
        run: ruff check . --output-format=github

      - name: Run black (formatter check)
        run: black --check --diff .

  # ── Stage 2: Tests ─────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ── Stage 3: Edge Benchmark (CPU, no GPU required) ──────────────────────────
  benchmark:
    name: CPU Benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install inference dependencies
        run: pip install onnxruntime numpy psutil

      - name: Generate dummy ONNX model for CI
        run: |
          pip install onnx
          python -c "
          import onnx
          from onnx import helper, TensorProto
          X = helper.make_tensor_value_info('images', TensorProto.FLOAT, [1, 3, 640, 640])
          Y = helper.make_tensor_value_info('output0', TensorProto.FLOAT, [1, 84, 8400])
          node = helper.make_node('Identity', ['images'], ['output0'])
          graph = helper.make_graph([node], 'ci_test', [X], [Y])
          model = helper.make_model(graph, opset_imports=[helper.make_opsetid('', 17)])
          import pathlib; pathlib.Path('models').mkdir(exist_ok=True)
          onnx.save(model, 'models/best.onnx')
          print('Dummy ONNX model created')
          "

      - name: Run edge benchmark (1 thread, CI mode)
        run: |
          python benchmarks/edge_benchmark.py \
            --model models/best.onnx \
            --threads 1 2 \
            --output results/ci_benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: results/

  # ── Stage 4: Build Container Image ─────────────────────────────────────────
  build:
    name: Build & Push Edge Container
    runs-on: ubuntu-latest
    needs: [test, benchmark]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push multi-arch image (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: orchestration/docker/Dockerfile.edge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 5: Deploy to Edge Fleet (main branch only) ───────────────────────
  deploy:
    name: Deploy to Edge Devices
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible --version

      - name: Configure SSH key for edge devices
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EDGE_SSH_KEY }}" > ~/.ssh/edge_key
          chmod 600 ~/.ssh/edge_key

      - name: Run Ansible deployment playbook
        run: |
          ansible-playbook \
            orchestration/ansible/deploy_edge.yml \
            -i inventory.ini \
            --private-key ~/.ssh/edge_key \
            --extra-vars "container_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            --tags deploy,verify
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Post deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
