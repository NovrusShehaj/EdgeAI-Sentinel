# EdgeAI Sentinel — Ansible Inventory
# ─────────────────────────────────────────────────────────────────────────────
# Configure your edge devices here for deployment via ansible-playbook
#
# Usage:
#   ansible-playbook orchestration/ansible/deploy_edge.yml -i inventory.ini
#   ansible-playbook orchestration/ansible/deploy_edge.yml -i inventory.ini --tags deploy
#
# Requirements:
#   - SSH key-based authentication (no passwords)
#   - SSH user with sudo privileges (or use ansible_become_password)
#   - Network connectivity between controller and edge devices
# ─────────────────────────────────────────────────────────────────────────────

[edge_devices]
# Example: Raspberry Pi devices on local network
# Uncomment and update with your actual device IPs and credentials
#
# pi-01 ansible_host=192.168.1.101 ansible_user=pi ansible_ssh_private_key_file=~/.ssh/id_rsa
# pi-02 ansible_host=192.168.1.102 ansible_user=pi ansible_ssh_private_key_file=~/.ssh/id_rsa
#
# Example: Jetson Nano on cloud
# jetson-01 ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/jetson_key

# Example: X86 edge server
# server-01 ansible_host=192.168.1.200 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[edge_devices:vars]
# IP address of Prometheus monitoring server (for firewall rules)
# Update this to your actual monitoring server IP
monitoring_server_ip=192.168.1.10

# SSH connection timeout (seconds)
ansible_ssh_common_args=-o ConnectTimeout=10

# Become method for privilege escalation
ansible_become_method=sudo
# Uncomment and set if not using key-based sudo (not recommended for security)
# ansible_become_password=your_sudo_password
