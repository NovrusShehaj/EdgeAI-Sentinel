# Local compose scrape configuration.
# Fleet IPs belong in a private inventory, not in this repository.
# Alertmanager routing is intentionally empty until an on-call path exists.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "edgeai-sentinel"
    environment: "local"

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sentinel_edge"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "sentinel-api:8080"
          - "host.docker.internal:8080"
        labels:
          device_type: "edge"
          deployment: "local_compose"

  - job_name: "node_exporter_local"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          device_type: "workstation"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          labels:
            routing: "not_configured"
