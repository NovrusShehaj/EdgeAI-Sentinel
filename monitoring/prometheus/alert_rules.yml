groups:
  - name: sentinel.rules
    rules:
      - alert: SentinelTargetDown
        expr: up{job="sentinel_edge"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sentinel scrape target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for more than 2 minutes."

      - alert: SentinelReadyFailed
        expr: sentinel_model_ready == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sentinel model is not ready"
          description: "sentinel_model_ready is 0 on {{ $labels.instance }}."

      - alert: SentinelHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(sentinel_inference_latency_ms_bucket[5m])) by (le, instance)) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sentinel p95 inference latency is above 500ms"
          description: "p95 latency on {{ $labels.instance }} is {{ $value }} ms."
