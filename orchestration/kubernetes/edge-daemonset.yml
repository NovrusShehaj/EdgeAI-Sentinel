# EdgeAI Sentinel — single-node or per-node edge inference.
#
# Models live on each node at /opt/sentinel/models (hostPath). A single RWO PVC
# is not used because it cannot mount on every DaemonSet node.
#
# Build and load locally:
#   docker build -f orchestration/docker/Dockerfile.edge -t sentinel-edge:<git-sha> .
#   kubectl apply -f orchestration/kubernetes/edge-daemonset.yml

---
apiVersion: v1
kind: Namespace
metadata:
  name: sentinel
  labels:
    app.kubernetes.io/part-of: edgeai-sentinel

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel
data:
  CONF_THRESHOLD: "0.45"
  IOU_THRESHOLD: "0.45"
  NUM_THREADS: "4"
  CLASS_NAMES: "object"
  PORT: "8080"
  INFER_TIMEOUT_S: "5"
  MAX_UPLOAD_BYTES: "5242880"
  MAX_IMAGE_SIDE: "4096"
  ALLOWED_HOSTS: "*"
  MODEL_PATH: "/models/best.onnx"
  MODEL_MANIFEST_PATH: "/models/model_manifest.json"

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sentinel-inference
  namespace: sentinel
  labels:
    app: sentinel-inference
    app.kubernetes.io/part-of: edgeai-sentinel
    app.kubernetes.io/component: inference
spec:
  selector:
    matchLabels:
      app: sentinel-inference
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: sentinel-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        role: edge-inference
      tolerations:
        - key: "arm64"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: sentinel-edge:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sentinel-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinel-api-token
                  key: API_TOKEN
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1500Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          hostPath:
            path: /opt/sentinel/models
            type: Directory
        - name: tmp
          emptyDir: {}
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-service
  namespace: sentinel
  labels:
    app: sentinel-inference
spec:
  type: NodePort
  selector:
    app: sentinel-inference
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
