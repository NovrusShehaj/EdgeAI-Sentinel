---
# EdgeAI Sentinel — one-device provisioning and deployment.
#
# Usage:
#   ansible-playbook orchestration/ansible/deploy_edge.yml -i inventory.local.ini
#   ansible-playbook orchestration/ansible/deploy_edge.yml -i inventory.local.ini --tags deploy,verify
#
# Real inventory stays out of Git. Copy inventory.ini.example to inventory.local.ini.

- name: EdgeAI Sentinel — Edge Device Provisioning and Deployment
  hosts: edge_devices
  become: true
  gather_facts: true

  vars:
    app_name: sentinel
    app_dir: /opt/sentinel
    model_dir: /opt/sentinel/models
    container_image: "{{ lookup('env', 'SENTINEL_IMAGE') | default('sentinel-edge:local', true) }}"
    api_port: 8080
    sentinel_user: sentinel
    class_names: object
    conf_threshold: "0.45"
    iou_threshold: "0.45"
    num_threads: "4"
    infer_timeout_s: "5"
    api_token: "{{ lookup('env', 'API_TOKEN') }}"

  pre_tasks:
    - name: Assert target is ARM64 or AMD64
      ansible.builtin.assert:
        that: ansible_architecture in ["aarch64", "x86_64"]
        msg: "Unsupported architecture: {{ ansible_architecture }}"

    - name: Require API token for deployment
      ansible.builtin.assert:
        that: api_token | length > 0
        msg: "Set API_TOKEN in the environment before deploying"

    - name: Print deployment target info
      ansible.builtin.debug:
        msg: |
          Deploying to {{ inventory_hostname }}
          OS:   {{ ansible_distribution }} {{ ansible_distribution_version }}
          Arch: {{ ansible_architecture }}
          RAM:  {{ ansible_memtotal_mb }} MB
          Image: {{ container_image }}

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [setup]

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - ufw
          - python3-pip
          - python3-docker
          - git
          - docker.io
        state: present
      tags: [setup, docker]

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
      tags: [setup, docker]

    - name: Create sentinel system user without Docker-group access
      ansible.builtin.user:
        name: "{{ sentinel_user }}"
        system: true
        shell: /usr/sbin/nologin
        state: present
      tags: [security]

    - name: Configure UFW — deny all incoming by default
      ufw:
        state: enabled
        default: deny
        direction: incoming
      tags: [security]

    - name: Configure UFW — allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp
      tags: [security]

    - name: Configure UFW — allow Sentinel API from monitoring network only
      ufw:
        rule: allow
        port: "{{ api_port }}"
        proto: tcp
        src: "{{ monitoring_server_ip | default('127.0.0.1') }}"
      tags: [security]

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ sentinel_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ model_dir }}"
        - "{{ app_dir }}/logs"
      tags: [deploy]

    - name: Transfer ONNX model when a local artifact is provided
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ model_dir }}/{{ item | basename }}"
        owner: root
        group: "{{ sentinel_user }}"
        mode: "0644"
      loop: "{{ query('fileglob', 'models/*.onnx') + query('fileglob', 'models/model_manifest.json') }}"
      when: item | length > 0
      tags: [deploy, model]
      notify: Restart sentinel container

    - name: Inspect local container image
      docker_image_info:
        name: "{{ container_image }}"
      register: local_image
      tags: [deploy]

    - name: Pull container image when it is not present locally
      docker_image:
        name: "{{ container_image }}"
        source: pull
        state: present
      when: local_image.images | length == 0
      tags: [deploy]

    - name: Confirm the container image is present
      docker_image_info:
        name: "{{ container_image }}"
      register: acquired_image
      tags: [deploy]

    - name: Fail if the container image is still unavailable
      ansible.builtin.assert:
        that: acquired_image.images | length > 0
        fail_msg: "Image {{ container_image }} is not available locally and could not be pulled"
      tags: [deploy]

    - name: Deploy Sentinel inference container
      docker_container:
        name: "{{ app_name }}"
        image: "{{ container_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ api_port }}:8080"
        volumes:
          - "{{ model_dir }}:/app/models:ro,z"
          - "{{ app_dir }}/logs:/app/logs"
        env:
          MODEL_PATH: "/app/models/best.onnx"
          MODEL_MANIFEST_PATH: "/app/models/model_manifest.json"
          CLASS_NAMES: "{{ class_names }}"
          CONF_THRESHOLD: "{{ conf_threshold }}"
          IOU_THRESHOLD: "{{ iou_threshold }}"
          NUM_THREADS: "{{ num_threads }}"
          INFER_TIMEOUT_S: "{{ infer_timeout_s }}"
          API_TOKEN: "{{ api_token }}"
          PORT: "8080"
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live')"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 20s
      tags: [deploy]

    - name: Write Prometheus scrape target file
      ansible.builtin.template:
        src: templates/prometheus_target.yml.j2
        dest: "{{ app_dir }}/prometheus_target.yml"
        mode: "0644"
      tags: [monitoring]

    - name: Wait for process liveness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/live"
        method: GET
        status_code: 200
      retries: 6
      delay: 5
      tags: [verify]

    - name: Wait for model readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/ready"
        method: GET
        return_content: true
        status_code: 200
      register: ready_response
      retries: 6
      delay: 10
      until: ready_response.status == 200
      tags: [verify]

    - name: Assert the loaded model is ready
      ansible.builtin.assert:
        that:
          - (ready_response.content | from_json).ready | bool
          - (ready_response.content | from_json).model_loaded | bool
        fail_msg: "Sentinel reported not ready: {{ ready_response.content }}"
      tags: [verify]

    - name: Print readiness payload
      ansible.builtin.debug:
        msg: "{{ ready_response.content | from_json }}"
      tags: [verify]

  handlers:
    - name: Restart sentinel container
      docker_container:
        name: "{{ app_name }}"
        state: started
        restart: true
